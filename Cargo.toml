[workspace]
resolver = "3"
members = ["src/libs/config","src/bins/rev_proxy"]

[workspace.dependencies]


pingora-core = "0.8.1"
pingora-proxy = "0.8.1"
pingora-load-balancing= "0.8.1"
pingora-http = "0.8.1"
pingora-error = "0.8.1"
async-trait = "0.1.92"
log = "0.4.33"
env_logger = "0.11.11"

config = {path = "src/libs/config"}

tokio = { version = "1.53.1", features = ["full"] }
serde = {version = "1.0.229", features = ["derive"] }
axum = {version = "0.8.9"}
anyhow = {version = "1.0.104"}
thiserror = {version = "2.0.19"}
sqlx = {version = "0.9.0"}
uuid = {version = "1.24.0", features = ["serde"]}
toml = {version = "1.1.4", features = ["serde"]}
serde_valid = {version = "2.0.3"}
dashmap = {version = "6.2.1"}
arc-swap = {version = "1.9.2"}
atomic_enum = "0.3.0"
